# halOS: kernel and network settings with no runtime cost (security audit R5).
# Only root may read kernel addresses and the kernel log (sudo dmesg still works).
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
# A process may only attach a debugger to its own children (or with sudo). nvtop and amd-smi
# read /proc, which this doesn't touch.
kernel.yama.ptrace_scope = 1
# A server doesn't take or send ICMP redirects.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# No process may push keystrokes into a terminal it doesn't own (TIOCSTI). Fedora's kernel is
# built with this off already; the line keeps it off if that ever changes. Commands such as
# halogenctl run scripts as the halogen user; this keeps anything running as halogen from
# typing into an admin's root shell. Nothing in halOS uses it.
dev.tty.legacy_tiocsti = 0
