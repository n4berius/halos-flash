# halOS's journal limits (#107). The journal lives on /var/log (10 GiB on guided installs), beside
# /var/log/audit on older installs without a volume of its own (auditd keeps at most 2 GB).
# Compression stays on (journald's default).
[Journal]
SystemMaxUse=4G
SystemKeepFree=1G
SystemMaxFileSize=128M
MaxRetentionSec=90day
