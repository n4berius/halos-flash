# halOS's journal limits (#107). The journal lives on /var/log (10 GiB on guided installs), beside
# /var/log/audit on older installs without a volume of its own (auditd keeps at most 2 GB).
# Compression stays on (journald's default).
[Journal]
SystemMaxUse=4G
SystemKeepFree=1G
SystemMaxFileSize=128M
MaxRetentionSec=90day
# A longer line is cut into several entries, and fail2ban reads the front door's access log one
# entry at a time. Caddy takes at most 32 KB of request line and headers (plus Go's 4 KB of
# slack), and bytes that aren't text are written six characters each: 256K holds the worst line.
LineMax=256K
