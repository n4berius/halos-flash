# halOS: fail2ban runs as root (it reads the journal and tells the firewall whom to shut out), so it
# gets the sandbox halOS's other root services have. It may write only its own state and runtime
# folders, and change the firewall only through nft (its own table).
[Service]
# /var/lib/fail2ban comes with the package, but an image update doesn't add to /var on a machine
# that is already installed: systemd makes it.
StateDirectory=fail2ban
StateDirectoryMode=0700
RuntimeDirectory=fail2ban
RuntimeDirectoryPreserve=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
# No NoNewPrivileges here: fail2ban has its own SELinux domain, and this policy doesn't let
# systemd switch into it under that option (it does for sshd and firewalld). It would stay in
# systemd's domain, which may not write fail2ban's database. The capability set below limits it.
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
# CAP_NET_ADMIN: bans are set with nft, in fail2ban's own table.
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_NET_ADMIN
# It talks to nobody over the network (nft speaks netlink to the kernel), sees no other
# process in /proc, and keeps to the system calls an ordinary service uses.
IPAddressDeny=any
ProtectProc=invisible
PrivateIPC=yes
UMask=0077
SystemCallFilter=@system-service
MemoryMax=256M
# Under a flood of failed requests, fail2ban and the firewall-cmd it starts for each ban yield to
# Halogen: half a core at most, low priority, few processes.
CPUQuota=50%
Nice=10
TasksMax=64
