d /var/lib/halos 0750 root root -
# The login status (halos-status.service) may write only these.
d /run/issue.d 0755 root root -
d /run/motd.d 0755 root root -
f /run/agetty.reload 0644 root root -
# Root's HTTPS folders: your certificate and key, and the DNS provider's credentials, which
# halos-proxy.service loads with LoadCredential= (the folder must exist for it to start).
d /etc/halos/https 0700 root root -
d /etc/halos/https/dns 0700 root root -
