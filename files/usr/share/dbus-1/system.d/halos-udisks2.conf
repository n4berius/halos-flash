<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- halOS: the halogen user (Halogen and its downloads) has no business with udisks2, so it may not
     call it: no reading the disk layout, no call that reaches its code before it checks
     permissions. (dbus-broker still starts the service for a call to it, then refuses the call.)
     A user policy overrides udisks2's own default allow. -->
<busconfig>
  <policy user="halogen">
    <deny send_destination="org.freedesktop.UDisks2"/>
  </policy>
</busconfig>
