# Requests to Halogen's API that were answered 401 (no API key, or a wrong one), from the access
# log halOS's front door (Caddy, halos-proxy.service) writes to the journal, one JSON object a line.
# The pattern starts at the beginning of the line and takes the address from the first field of
# "request", which Caddy writes itself: text a client sends (the address it asks for) comes later
# in the line with its quotes escaped, so it can't pass for that field.
[Definition]
failregex = ^\{"level":"info","ts":[0-9.e+]+,"logger":"http\.log\.access[^"]*","msg":"handled request","request":\{"remote_ip":"<ADDR>",.*"status":401[,}]
ignoreregex =
journalmatch = _SYSTEMD_UNIT=halos-proxy.service
