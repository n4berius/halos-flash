# halOS: fail2ban's own messages go to the journal (sudo journalctl -u fail2ban), not to a file
# in /var/log that nothing would rotate.
[DEFAULT]
logtarget = SYSTEMD-JOURNAL
# Bans and unbans are logged, not one line for every failed request (a flood of wrong keys
# would otherwise write the journal twice over), and the database keeps no log lines.
loglevel = NOTICE
dbmaxmatches = 0
