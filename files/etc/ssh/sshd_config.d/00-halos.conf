# halOS: root never logs in over SSH, with a password or a key. Log in as your admin user
# and use sudo. sshd uses the first value it reads, and this file sorts before the
# installer's 01-permitrootlogin.conf, so the installer's "allow root SSH" can't undo it.
PermitRootLogin no
# A headless server has no use for X11 forwarding (Fedora's 50-redhat.conf turns it on).
X11Forwarding no
# The halogen service user never logs in: its account has no shell and no password, but a key
# planted in its home (by something that broke out of Halogen) could still open an SSH session
# for port forwarding to the services on 127.0.0.1.
DenyUsers halogen
