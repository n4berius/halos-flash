[Container]
# The prompt cache on disk (Halogen's HALOGEN_CACHE_DIR): a conversation survives a restart of
# Halogen instead of being read again in full. The one writable folder under the models; prepare
# makes it at boot. Mounted over its own place under /models, not at a second path: there the
# read-only /models mount would show the same folder without noexec.
# In a drop-in so that "sudo halogenctl cache off" can make it read-only: root's file of the same
# name in /etc/containers/systemd/users/halogen.container.d/ takes this one's place (Quadlet reads
# the all-users folder first; checked with podman 6.1.3). Don't copy this line into halogen.container:
# podman refuses two mounts at one place.
Volume=/srv/models/.prompt-cache:/models/.prompt-cache:noexec,nosuid,nodev
