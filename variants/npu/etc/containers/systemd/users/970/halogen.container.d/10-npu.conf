[Container]
# XRT comes with Halogen's image (from 0.19.1), so only the NPU device is passed in.
AddDevice=/dev/accel/accel0
Volume=/srv/models/npu:/models/npu:ro,noexec,nosuid,nodev
# Your own checkpoints, named by path in HALOGEN_NPU_MODELS (/models/LFM/LFM3-1.7B). Writable,
# so Halogen keeps each one's NPU conversion beside it instead of redoing it at every start.
# No programs, set-uid files or devices from them: these are the folders a break-in through
# Halogen could write and find again after a restart. Halogen maps nothing executable from them
# (checked in its processes' maps on freyja, with OvisOCR3 and the NPU models loaded). The npu
# folder above holds the NPU's programs (.elf files sent to the device) and weights, no libraries.
Volume=/srv/models/decider:/models/decider:noexec,nosuid,nodev
Volume=/srv/models/LFM:/models/LFM:noexec,nosuid,nodev
Volume=/srv/models/custom:/models/custom:noexec,nosuid,nodev

