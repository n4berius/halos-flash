# Automatic partitioning for the "custom partitioning" boot entry; the default guided entry lays
# the disk out itself (installer/guided/plan-install). "Custom" in the installer can still
# change it. The models volume takes the rest of the disk.
[Storage]
default_scheme = LVM
file_system_type = xfs
default_partitioning =
    /                 (min 15 GiB, max 40 GiB)
    /var              (min 20 GiB, max 60 GiB)
    /var/log          (min 5 GiB, max 10 GiB)
    /var/log/audit    (min 2 GiB, max 5 GiB)
    /home             (min 5 GiB, max 50 GiB)
    /var/srv/configs  (min 1 GiB, max 1 GiB)
    /var/srv/logs     (min 4 GiB, max 4 GiB)
    /var/srv/models   (min 150 GiB)
