name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "alpha builds main; beta, rc and stable promote the newest release one step below. The number is worked out for you."
        required: true
        type: choice
        options: [alpha, beta, rc, stable]
      from_main:
        description: "beta, rc or stable only: build from main instead of promoting (for example a stable fix)"
        type: boolean
        default: false

# Each job gets only what it needs (below); this is the default for any other.
permissions:
  contents: read

jobs:
  info:
    runs-on: ubuntu-24.04
    # contents: write to push the release tag.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      image_tag: ${{ steps.info.outputs.image_tag }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Pick the tag and the code to build
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ inputs.release }}
          FROM_MAIN: ${{ inputs.from_main && '1' || '0' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Promote only what was published: a tag whose release run failed has no release.
            git tag -l 'v*' > "$RUNNER_TEMP/tags"
            gh release list --exclude-drafts --limit 1000 --json tagName -q '.[].tagName' > "$RUNNER_TEMP/released"
            out="$(scripts/next-tag.sh "$RELEASE" "$FROM_MAIN" "$RUNNER_TEMP/tags" "$RUNNER_TEMP/released")"
            tag="$(sed -n 's/^tag=//p' <<< "$out")"; source="$(sed -n 's/^source=//p' <<< "$out")"
            if [ "$source" = main ]; then ref="$GITHUB_SHA"; else ref="$(git rev-list -n 1 "$source")"; fi
          else
            tag="$GITHUB_REF_NAME"; source="tag pushed by hand"; ref="$GITHUB_SHA"
          fi
          echo "Release $tag from $source ($ref)"
          echo "Channels it would move now: $(scripts/channels.sh "$tag")"
          { echo "tag=$tag"; echo "ref=$ref"; } >> "$GITHUB_OUTPUT"
      - name: Check the code is on main
        env:
          REF: ${{ steps.pick.outputs.ref }}
        run: git merge-base --is-ancestor "$REF" origin/main
      - id: info
        env:
          TAG: ${{ steps.pick.outputs.tag }}
          REF: ${{ steps.pick.outputs.ref }}
        run: |
          # Checked against the versions.env of the code being released, not of main.
          git checkout -q "$REF"
          scripts/release-info.sh "$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.pick.outputs.tag }}
          REF: ${{ steps.pick.outputs.ref }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; run the release again to take the next number." >&2
            exit 1
          fi
          git tag "$TAG" "$REF"
          git push origin "$TAG"

  image:
    needs: info
    runs-on: ubuntu-24.04
    # The signing key lives in the "signing" environment, which only main and v* tags may use (#46).
    environment: signing
    # id-token: signing the pushed images with GitHub's identity (scripts/sign-image.sh).
    permissions:
      contents: read
      packages: write
      id-token: write
    # One release or weekly rebuild moves an edition's channel tags at a time, so a slower
    # build that finishes later can't move a channel back. Shared with refresh.yml.
    concurrency:
      group: channel-tags-${{ matrix.variant }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        variant: [npu, no-npu]
    env:
      HALOGEN_VARIANT: ${{ matrix.variant }}
      IMAGE_TAG: ${{ needs.info.outputs.image_tag }}
      TAG: ${{ needs.info.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.info.outputs.tag }}
          fetch-depth: 0
      - run: tests/run.sh
      - name: Build
        # Only the build gets the release name; tests read what the image says, not the job.
        env:
          HALOS_RELEASE: ${{ needs.info.outputs.tag }}
        run: scripts/build.sh
      - name: Push the exact tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Which channels to move is worked out now, with every tag pushed so far, so a release
          # made during this build counts. main's channel script is used, because a promoted
          # release's code may predate it. None for an old release run again.
          git fetch -q --force --tags origin
          git show origin/main:scripts/channels.sh > "$RUNNER_TEMP/channels.sh"
          git tag -l 'v*' > "$RUNNER_TEMP/tags"
          channels="$(bash "$RUNNER_TEMP/channels.sh" "$TAG" "$RUNNER_TEMP/tags")"
          echo "Moving the channels: ${channels:-none, a newer release exists}"
          # Push the exact tag and sign it first (main's script, #46), so a channel never points
          # to an unsigned image; the signature is per digest, so it covers the channel tags too.
          image="$(scripts/image-ref.sh)"; base="${image%:*}"
          suffix=""; [ "$HALOGEN_VARIANT" = npu ] || suffix="-no-npu"
          podman push "$image"
          git show origin/main:scripts/sign-image.sh > "$RUNNER_TEMP/sign-image.sh"
          { echo "IMAGE=$image"; echo "CHANNELS=$channels"; } >> "$GITHUB_ENV"
      - name: Sign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # halOS's own signing key (#46): only this step gets it, and it runs only main's script.
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: GITHUB_TOKEN="$GH_TOKEN" bash "$RUNNER_TEMP/sign-image.sh" "$IMAGE"
      - name: Move the channels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="${IMAGE%:*}"; suffix=""; [ "$HALOGEN_VARIANT" = npu ] || suffix="-no-npu"
          channels="$CHANNELS"
          # One channel per call, which the push script of older code also accepts.
          refs=()
          for channel in $channels; do
            scripts/push-image.sh "$channel"
            refs+=("$base:$channel$suffix")
            [ "$channel" != stable ] || refs+=("$base:latest$suffix")
          done
          [ "${#refs[@]}" = 0 ] || bash "$RUNNER_TEMP/sign-image.sh" --verify "${refs[@]}"

  iso:
    needs: [info, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # packages: read to pull the image just pushed.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant: [npu, no-npu]
    env:
      HALOGEN_VARIANT: ${{ matrix.variant }}
      IMAGE_TAG: ${{ needs.info.outputs.image_tag }}
      TAG: ${{ needs.info.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.info.outputs.tag }}
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf tesseract-ocr genisoimage swtpm swtpm-tools
          # Ubuntu's AppArmor profile for swtpm only allows libvirt's paths.
          if [ -e /etc/apparmor.d/usr.bin.swtpm ]; then sudo apparmor_parser -R /etc/apparmor.d/usr.bin.swtpm || true; fi
          sudo chmod 666 /dev/kvm
      - name: Pull the published image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sudo podman pull "$(scripts/image-ref.sh)"
      - name: Build ISO
        run: sudo -E scripts/build-iso.sh
      - name: Install and boot with Secure Boot on
        run: tests/iso-install.sh "$(sudo find output -name '*.iso' | head -1)" "$(scripts/image-ref.sh)" install-test "$HALOGEN_VARIANT"
      - name: Package for GitHub Releases
        run: |
          sudo chown -R "$USER" output
          name="halos-flash-$TAG-$HALOGEN_VARIANT.iso"
          scripts/package-iso.sh "$(find output -name '*.iso' | head -1)" assets "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-${{ matrix.variant }}
          path: assets/*
          compression-level: 0
          retention-days: 1

  publish:
    needs: [info, iso]
    runs-on: ubuntu-24.04
    # contents: write to create the GitHub release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.info.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.info.outputs.prerelease }}
          TAG: ${{ needs.info.outputs.tag }}
        run: |
          # Every option each edition offers, to read before upgrading (also on the machine as
          # /srv/configs/halogen.env.example, and listed by sudo halogenctl options).
          for edition in npu no-npu; do
            cp "variants/$edition/usr/share/halogen/halogen.env.default" "assets/halos-flash-$TAG-$edition-halogen.env.example"
          done
          flags=(--generate-notes --verify-tag --title "$TAG")
          [ "$PRERELEASE" = false ] || flags+=(--prerelease --latest=false)
          gh release create "$TAG" "${flags[@]}" assets/*
