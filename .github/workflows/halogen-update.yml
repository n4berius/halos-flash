name: Halogen update
# Opens a pull request when halogen-flash-server publishes a newer release.
# Merging and releasing stay a person's decision.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Halogen version, such as 0.19.0. Empty means the newest release
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Fetch upstream
        run: git clone -q --filter=blob:none --no-checkout https://github.com/peonist-ai/halogen-flash-server "$RUNNER_TEMP/upstream"
      - name: Update the pins
        id: update
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/halogen-update.sh "$RUNNER_TEMP/upstream" "$RUNNER_TEMP/body.md" "$VERSION"
          if git diff --quiet; then
            echo "Already on the newest Halogen release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          . ./versions.env
          echo "version=$HALOGEN_VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=halogen-update/$HALOGEN_VERSION" >> "$GITHUB_OUTPUT"
      # A release that adds an option fails the tests until option-kinds (and maybe more) has its
      # line, by design. The pull request is still opened, as a draft that names the failure,
      # so a person can finish it on its branch (0.21.0's run stopped here and opened nothing).
      - name: Check the new pins
        id: check
        if: steps.update.outputs.version != ''
        run: |
          set +e
          tests/run.sh > "$RUNNER_TEMP/tests.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/tests.log"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" != 0 ]; then
            {
              echo
              echo '## tests/run.sh failed'
              echo
              echo 'The update needs work by hand before it can merge. The end of the output:'
              echo
              echo '```'
              grep -v '^ok: ' "$RUNNER_TEMP/tests.log" | tail -n 30 | sed 's/```/` ` `/g'
              echo '```'
            } >> "$RUNNER_TEMP/body.md"
            echo "tests/run.sh failed; the pull request opens as a draft." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Open the pull request
        if: steps.update.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
          BRANCH: ${{ steps.update.outputs.branch }}
          TESTS_RC: ${{ steps.check.outputs.rc }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "$BRANCH already exists, so its pull request is already open or was closed on purpose." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qam "Move to Halogen $VERSION" -m "Pins, upstream hashes and options from halogen-flash-server $VERSION, by the Halogen update workflow."
          git push -q origin "$BRANCH"
          draft=()
          [ "$TESTS_RC" = 0 ] || draft=(--draft)
          url="$(gh pr create "${draft[@]}" --base main --head "$BRANCH" --title "Move to Halogen $VERSION" --body-file "$RUNNER_TEMP/body.md")"
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
          # A pull request opened with this workflow's token starts no workflows by itself,
          # so start the image build and the install test on its branch.
          gh workflow run build.yml --ref "$BRANCH"
          gh workflow run iso.yml --ref "$BRANCH"
      - name: Fail when the tests failed
        if: steps.check.outputs.rc != '' && steps.check.outputs.rc != '0'
        run: |
          echo "tests/run.sh failed on the new pins; the draft pull request names the failure." >&2
          exit 1
