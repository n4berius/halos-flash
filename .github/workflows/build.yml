name: Build OS image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly rebuild of edge, so machines that follow it (freyja) get Fedora's security fixes
  # even in weeks with no change to this repository. A scheduled run always builds, since
  # there is no previous commit to compare with.
  schedule:
    - cron: "37 5 * * 4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # podman build commits a layer after every step, and on GitHub's runners overlay's native diff is
  # off (their kernel has CONFIG_OVERLAY_FS_REDIRECT_DIR), so each commit walks the whole tree:
  # about 8 s per step for the OS image, about 3 s for the installer. CI keeps nothing between
  # runs, so it gains nothing from layers; this commits each stage once. Local builds keep them.
  BUILDAH_LAYERS: "false"

jobs:
  # The quick checks, once, before either edition's image is built (#123): the script suite and
  # the Go tests of halOS's Caddy modules. Read-only, no environment, so no signing key.
  check:
    runs-on: ubuntu-24.04
    # A hung step stops the job after this, not after GitHub's six hours (each limit is several times the usual run).
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run checks
        run: tests/run.sh
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/caddy/go.mod
          # No cache: simpler, and nothing is shared between runs.
          cache: false
      - name: Go tests
        run: scripts/go-test.sh
      - name: go.mod and go.sum are unchanged
        run: git diff --exit-code -- src/caddy

  # bf16-to-hgn, halogen-dashboard and Caddy (Containerfile.helpers), built once on the base by
  # digest and handed to the four image jobs as an artifact of this run only (#122): they took
  # each job the same time again, and nothing is cached between runs, so a pull request can't
  # leave anything for main or a release to pick up. Runs beside check, not after it.
  helpers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: See whether the image changed
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null \
             || git diff --name-only "$BASE" HEAD | scripts/needs-build.sh; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Only docs or repository files changed, so the build is skipped."
          fi
      - name: Build the helpers
        if: steps.changes.outputs.build == 'true'
        # A tar keeps the programs' modes, which the artifact's zip would drop.
        run: |
          scripts/build-helpers.sh "$RUNNER_TEMP/helpers"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/helpers.tar" helpers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.changes.outputs.build == 'true'
        with:
          name: helpers
          path: ${{ runner.temp }}/helpers.tar
          if-no-files-found: error
          # A re-run of the run's failed jobs can still find it a few days later.
          retention-days: 3
          overwrite: true

  # Pull requests and runs on other branches (the update workflows start it there): build and
  # check only, with read-only rights, so code from a branch never holds a token that can push
  # packages or ask GitHub for a signing identity. main's run is the publish job below, the same
  # steps plus Push and Sign.
  build:
    # main's ruleset requires "build (npu)" and "build (no-npu)": the Fedora-kernel jobs keep
    # those names; the test-kernel jobs are "build (<edition>, kernel-next)" and not required.
    name: build (${{ matrix.variant }}${{ matrix.kernel == 'next' && ', kernel-next' || '' }})
    needs: [check, helpers]
    # Runs even when a job it needs failed, and then fails itself: a skipped job counts as passed,
    # and only check and the build jobs are required checks, so a failed helpers build must fail
    # "build (npu)" as it did when the helpers were built inside it.
    if: ${{ !cancelled() && !(github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy: &build-strategy
      fail-fast: false
      matrix:
        variant: [npu, no-npu]
        # next: the kernel-next images, with the test kernel versions.env names (pushed beside edge).
        kernel: [fedora, next]
    env: &build-env
      HALOGEN_VARIANT: ${{ matrix.variant }}
      KERNEL_TRACK: ${{ matrix.kernel }}
      # The test-kernel image is tagged kernel-next (scripts/image-ref.sh), the tag it is pushed as.
      IMAGE_TAG: ${{ matrix.kernel == 'next' && 'kernel-next' || '' }}
    steps:
      - &step-gate
        name: The checks and the helpers passed
        env:
          CHECK: ${{ needs.check.result }}
          HELPERS: ${{ needs.helpers.result }}
        run: |
          [ "$CHECK" = success ] && [ "$HELPERS" = success ] \
            || { echo "check: $CHECK, helpers: $HELPERS" >&2; exit 1; }
      - &step-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &step-helpers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.helpers.outputs.build == 'true'
        with:
          name: helpers
          path: ${{ runner.temp }}
      - &step-build
        name: Build
        if: needs.helpers.outputs.build == 'true'
        run: |
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/helpers.tar"
          HALOS_HELPERS="$RUNNER_TEMP/helpers" scripts/build.sh
      # What went into the image (#121): the Fedora base's digest, every package, the toolchains.
      - &step-info
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.helpers.outputs.build == 'true'
        with:
          name: build-info-${{ matrix.variant }}-${{ matrix.kernel }}
          path: output/build-info-*.txt
          retention-days: 90

  # main only (push, the weekly run, a manual run): the same build, then edge is pushed and signed.
  publish:
    name: build and publish (${{ matrix.variant }}${{ matrix.kernel == 'next' && ', kernel-next' || '' }})
    needs: [check, helpers]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The signing key lives in the "signing" environment, which only main and v* tags may use (#46).
    environment: signing
    # id-token: signing the pushed edge image with GitHub's identity (scripts/sign-image.sh).
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy: *build-strategy
    env: *build-env
    steps:
      - *step-gate
      - *step-checkout
      - *step-helpers
      - *step-build
      - *step-info
      - name: Push
        # Its signature names main (scripts/sign-image.sh).
        if: needs.helpers.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # cosign first: a failed download must stop the run before anything is pushed.
          scripts/sign-image.sh --fetch
          channel="$([ "$KERNEL_TRACK" = next ] && echo kernel-next || echo edge)"
          edge="$(scripts/image-ref.sh | sed 's/:[^:]*$//'):$channel$([ "$HALOGEN_VARIANT" = npu ] || echo -no-npu)"
          podman push "$(scripts/image-ref.sh)" "$edge"
          echo "EDGE_IMAGE=$edge" >> "$GITHUB_ENV"
      - name: Sign
        if: needs.helpers.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # halOS's own signing key (#46): only this step gets it, and it runs only main's script.
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: GITHUB_TOKEN="$GH_TOKEN" scripts/sign-image.sh "$EDGE_IMAGE"
