name: Build USB installer
on:
  push:
    branches: [main]
    paths: &paths
      # versions.env pins Halogen's image, the base image and the weights: a change there needs the
      # full install test too.
      - versions.env
      - Containerfile*
      - installer/**
      - files/**
      - scripts/**
      - src/**
      - variants/**
      - tests/iso-*.sh
      - tests/guided.sh
      - tests/vm-login.py
      - tests/grub-pick.py
      - .github/workflows/iso.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # podman build commits a layer after every step, and on GitHub's runners overlay's native diff is
  # off (their kernel has CONFIG_OVERLAY_FS_REDIRECT_DIR), so each commit walks the whole tree:
  # about 8 s per step for the OS image, about 3 s for the installer. CI keeps nothing between
  # runs, so it gains nothing from layers; this commits each stage once. Local builds keep them.
  BUILDAH_LAYERS: "false"

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [npu, no-npu]
        kernel: [fedora]
        # The kernel-next test kernel, NPU edition: installs, unlocks with the TPM and boots.
        include:
          - variant: npu
            kernel: next
    env:
      HALOGEN_VARIANT: ${{ matrix.variant }}
      KERNEL_TRACK: ${{ matrix.kernel }}
      # The installer for the test kernel installs a system that follows :kernel-next, the tag
      # build.yml pushes (a version-named tag would never exist, so upgrade would fail).
      IMAGE_TAG: ${{ matrix.kernel == 'next' && 'kernel-next' || '' }}
      # Artifact names: the edition, plus -kernel-next for the test kernel.
      RUN_NAME: ${{ matrix.variant }}${{ matrix.kernel == 'next' && '-kernel-next' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Freeing disk space, the VM tools and the ISO builder's image took 1.5 to 3 minutes before
      # the build could start. They run beside the builds now; each is waited for where it's needed.
      - name: Start the setup in the background
        run: |
          scripts/ci-background.sh start free-disk sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          scripts/ci-background.sh start tools bash -c '
            set -e
            sudo apt-get update -q
            sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf tesseract-ocr genisoimage swtpm swtpm-tools squashfs-tools tang jose
            # The AppArmor profile Ubuntu ships for swtpm only allows the paths libvirt uses.
            if [ -e /etc/apparmor.d/usr.bin.swtpm ]; then sudo apparmor_parser -R /etc/apparmor.d/usr.bin.swtpm || true; fi
            sudo chmod 666 /dev/kvm'
          scripts/ci-background.sh start builder bash -c '. ./versions.env && sudo podman pull -q "$IMAGE_BUILDER"'
      - name: Read version
        run: grep '^HALOGEN_VERSION=' versions.env >> "$GITHUB_ENV"
      - name: Build the OS image and the installer image side by side
        # The installer image needs only the Fedora base, by digest, not the OS image: resolved
        # once here, both build on it (scripts/build-iso.sh checks it before the ISO is made).
        run: |
          read -r base _ < <(scripts/build-helpers.sh --resolve)
          echo "Fedora base: $base"
          export HALOS_BASE="$base"
          sudo podman pull -q "$base" > /dev/null
          scripts/ci-background.sh start installer sudo -E scripts/build-iso.sh installer
          sudo -E scripts/build.sh
          echo "::group::Installer image build"
          scripts/ci-background.sh wait installer 1800
          echo "::endgroup::"
      - name: Build ISO
        run: |
          scripts/ci-background.sh wait free-disk 600 > /dev/null
          # A failed pull here isn't fatal: the build pulls the image itself.
          scripts/ci-background.sh wait builder 600 || true
          df -h / | tail -1
          sudo -E scripts/build-iso.sh iso
      - name: Check the guided questions in the installer
        # tests/guided.sh with the installer's own bash, tools and kickstart parser, minutes
        # before the VM install would find a kickstart the installer can't read.
        run: |
          sudo podman run --rm --network=none -v "$PWD:/src:ro" -w /src \
            "localhost/halos-flash-installer:$HALOGEN_VERSION-$HALOGEN_VARIANT" \
            env HALOS_REQUIRE_PYKICKSTART=1 tests/guided.sh
      - name: Size report
        # What takes space in the OS image, installer and ISO. Kept as an artifact for trimming.
        run: |
          echo "::group::VM tools"
          scripts/ci-background.sh wait tools 900
          echo "::endgroup::"
          sudo -E scripts/size-report.sh "$(sudo find output -name '*.iso' | head -1)" > size-report.txt 2>&1 || true
          head -c 60000 size-report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-report-${{ env.RUN_NAME }}
          path: size-report.txt
          retention-days: 30
      - name: Boot with Secure Boot on
        run: tests/iso-boot.sh "$(sudo find output -name '*.iso' | head -1)" boot-test
      - name: Install and boot with Secure Boot on
        run: |
          iso="$(sudo find output -name '*.iso' | head -1)"
          # The test kernel's run checks the installed system booted it, not Fedora 45's.
          if [ "$KERNEL_TRACK" = next ]; then export HALOS_EXPECT_KERNEL="$(sed -n 's/^KERNEL_NEXT_NVR=//p' versions.env).x86_64"; fi
          tests/iso-install.sh "$iso" "$(scripts/image-ref.sh)" install-test "$HALOGEN_VARIANT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: boot-test-${{ env.RUN_NAME }}
          path: |
            boot-test/*.png
            boot-test/serial.log
            install-test/*.log
            install-test/*.txt
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halos-flash-${{ env.HALOGEN_VERSION }}-${{ env.RUN_NAME }}-installer
          path: output/**/*.iso
          compression-level: 0
          retention-days: 30
      - name: Check release packaging
        # Shows in the run summary whether a release of this build ships as one file.
        run: |
          iso="$(sudo find output -name '*.iso' | head -1)"
          mkdir -p package-test && sudo cp "$iso" package-test/in.iso && sudo chown -R "$USER" package-test
          scripts/package-iso.sh package-test/in.iso package-test/out "halos-flash-$HALOGEN_VARIANT.iso"
          rm -rf package-test
