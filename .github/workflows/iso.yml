name: Build USB installer
on:
  push:
    branches: [main]
    paths: &paths
      # versions.env pins Halogen's image, the base image and the weights: a change there needs the
      # full install test too.
      - versions.env
      - Containerfile*
      - installer/**
      - files/**
      - scripts/**
      - src/**
      - variants/**
      - tests/iso-*.sh
      - tests/guided.sh
      - tests/vm-login.py
      - .github/workflows/iso.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [npu, no-npu]
    env:
      HALOGEN_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf tesseract-ocr genisoimage swtpm swtpm-tools squashfs-tools
          # Ubuntu's AppArmor profile for swtpm only allows libvirt's paths.
          if [ -e /etc/apparmor.d/usr.bin.swtpm ]; then sudo apparmor_parser -R /etc/apparmor.d/usr.bin.swtpm || true; fi
          sudo chmod 666 /dev/kvm
      - name: Read version
        run: grep '^HALOGEN_VERSION=' versions.env >> "$GITHUB_ENV"
      - name: Build OS image
        run: sudo -E scripts/build.sh
      - name: Build ISO
        run: sudo -E scripts/build-iso.sh
      - name: Check the guided questions in the installer
        # tests/guided.sh with the installer's own bash, tools and kickstart parser, minutes
        # before the VM install would find a kickstart the installer can't read.
        run: |
          sudo podman run --rm --network=none -v "$PWD:/src:ro" -w /src \
            "localhost/halos-flash-installer:$HALOGEN_VERSION-$HALOGEN_VARIANT" \
            env HALOS_REQUIRE_PYKICKSTART=1 tests/guided.sh
      - name: Size report
        # What takes space in the OS image, installer and ISO. Kept as an artifact for trimming.
        run: |
          sudo -E scripts/size-report.sh "$(sudo find output -name '*.iso' | head -1)" > size-report.txt 2>&1 || true
          head -c 60000 size-report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-report-${{ matrix.variant }}
          path: size-report.txt
          retention-days: 30
      - name: Boot with Secure Boot on
        run: tests/iso-boot.sh "$(sudo find output -name '*.iso' | head -1)" boot-test
      - name: Install and boot with Secure Boot on
        run: |
          iso="$(sudo find output -name '*.iso' | head -1)"
          tests/iso-install.sh "$iso" "$(scripts/image-ref.sh)" install-test "$HALOGEN_VARIANT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: boot-test-${{ matrix.variant }}
          path: |
            boot-test/*.png
            boot-test/serial.log
            install-test/*.log
            install-test/*.txt
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halos-flash-${{ env.HALOGEN_VERSION }}-${{ matrix.variant }}-installer
          path: output/**/*.iso
          compression-level: 0
          retention-days: 30
      - name: Check release packaging
        # Shows in the run summary whether a release of this build ships as one file.
        run: |
          iso="$(sudo find output -name '*.iso' | head -1)"
          mkdir -p package-test && sudo cp "$iso" package-test/in.iso && sudo chown -R "$USER" package-test
          scripts/package-iso.sh package-test/in.iso package-test/out "halos-flash-$HALOGEN_VARIANT.iso"
          rm -rf package-test
