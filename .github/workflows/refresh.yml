name: Refresh stable with Fedora updates
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # podman build commits a layer after every step, and on GitHub's runners overlay's native diff is
  # off (their kernel has CONFIG_OVERLAY_FS_REDIRECT_DIR), so each commit walks the whole tree:
  # about 8 s per step for the OS image, about 3 s for the installer. CI keeps nothing between
  # runs, so it gains nothing from layers; this commits each stage once. Local builds keep them.
  BUILDAH_LAYERS: "false"

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # The signing key lives in the "signing" environment, which only main and v* tags may use (#46).
    environment: signing
    strategy:
      fail-fast: false
      matrix:
        variant: [npu, no-npu]
    # id-token: signing the rebuilt images with GitHub's identity (scripts/sign-image.sh).
    permissions:
      contents: read
      packages: write
      id-token: write
    # Shared with release.yml's channels job: one push moves an edition's channel tags at a time.
    concurrency:
      group: channel-tags-${{ matrix.variant }}
      cancel-in-progress: false
    env:
      HALOGEN_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the newest stable release
        id: stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The newest published stable release, not the newest tag: a release whose install
          # test failed has a tag but no release, and must never reach the stable channel.
          gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName -q '.[].tagName' > "$RUNNER_TEMP/released"
          # channels.sh orders old-style (v0.20.7, -r2) and new-style (v0.20.7-1-stable) tags.
          tag="$(scripts/channels.sh --sort stable "$RUNNER_TEMP/released" | tail -n 1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # main's channel script, kept aside: the release checked out next may predate it.
          cp scripts/channels.sh "$RUNNER_TEMP/channels.sh"
          cp scripts/sign-image.sh "$RUNNER_TEMP/sign-image.sh"
          cp scripts/build-info.sh "$RUNNER_TEMP/build-info.sh"
      - if: steps.stable.outputs.tag != ''
        env:
          TAG: ${{ steps.stable.outputs.tag }}
        run: |
          # Only a release made from main is rebuilt and signed, as release.yml requires.
          git merge-base --is-ancestor "$TAG" origin/main || { echo "$TAG is not on main; nothing rebuilt" >&2; exit 1; }
          git checkout "$TAG"
      - name: Rebuild
        if: steps.stable.outputs.tag != ''
        env:
          TAG: ${{ steps.stable.outputs.tag }}
        run: |
          # The plain Halogen version tag (0.20.7): what a weekly rebuild pushes. A release's own
          # tag (0.20.7-1-stable) never moves. Old releases' scripts print image_tag only, which
          # was that same plain version for a stable release.
          stable_tag=""
          eval "$(scripts/release-info.sh "$TAG" | grep -E '^(image_tag|stable_tag)=')"
          image_tag="${stable_tag:-$image_tag}"
          # The push step below needs the same names; it alone gets the signing key.
          { echo "IMAGE_TAG=$image_tag"; echo "HALOS_RELEASE=${TAG#v}"; } >> "$GITHUB_ENV"
          IMAGE_TAG="$image_tag" HALOS_RELEASE="${TAG#v}" scripts/build.sh
      - name: Build record
        if: steps.stable.outputs.tag != ''
        run: |
          # What this rebuild took from Fedora (#121): diff two weeks' records to see what changed.
          mkdir -p "$RUNNER_TEMP/info"
          out="$RUNNER_TEMP/info/build-info-$HALOGEN_VARIANT.txt"
          bash "$RUNNER_TEMP/build-info.sh" "$(scripts/image-ref.sh)" > "$out"
          { echo "### $HALOGEN_VARIANT"; echo '```'; grep -E '^HALOS_BASE_|^HALOS_RELEASE=|^# Image ID|^## Installed|^\(no base' "$out" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.stable.outputs.tag != ''
        with:
          name: build-info-${{ matrix.variant }}
          path: ${{ runner.temp }}/info/*
          retention-days: 90
      - name: Push the Halogen version tag
        if: steps.stable.outputs.tag != ''
        env:
          TAG: ${{ steps.stable.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Worked out just before pushing, with every tag so far, so a release made during
          # this build counts and no channel moves back.
          git fetch -q --force --tags origin
          git tag -l 'v*' > "$RUNNER_TEMP/tags"
          channels="$("$RUNNER_TEMP/channels.sh" "$TAG" "$RUNNER_TEMP/tags")"
          # The newest stable release always leads at least the stable channel.
          # None when a newer stable tag exists whose release run failed: release stable again
          # (from main) to resume the weekly rebuilds.
          # Every tag counts, published or not: a release between its channel move and its
          # publish step is newer, and its channels must not move back.
          newest="$("$RUNNER_TEMP/channels.sh" --sort stable "$RUNNER_TEMP/tags" | tail -n 1 || true)"
          [ -n "$channels" ] || { echo "::error::$TAG leads no channel: the newer stable tag $newest has no published release yet (still running, or it failed). Nothing was pushed. If it failed, release stable from main to resume the weekly rebuilds." >&2; exit 1; }
          echo "Moving the channels: $channels"
          # Push the exact tag and sign it first (main's script, #46), so a channel never points
          # to an unsigned image; the signature is per digest, so it covers the channel tags too.
          image="$(scripts/image-ref.sh)"; base="${image%:*}"
          suffix=""; [ "$HALOGEN_VARIANT" = npu ] || suffix="-no-npu"
          # cosign first: a failed download must stop the run before anything is pushed.
          bash "$RUNNER_TEMP/sign-image.sh" --fetch
          podman push "$image"
          { echo "IMAGE=$image"; echo "CHANNELS=$channels"; } >> "$GITHUB_ENV"
      - name: Sign
        if: steps.stable.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # halOS's own signing key (#46): only this step gets it, and it runs only main's script.
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: GITHUB_TOKEN="$GH_TOKEN" bash "$RUNNER_TEMP/sign-image.sh" "$IMAGE"
      - name: Move the channels
        if: steps.stable.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="${IMAGE%:*}"; suffix=""; [ "$HALOGEN_VARIANT" = npu ] || suffix="-no-npu"
          channels="$CHANNELS"
          # One channel per call, which the push script of older releases also accepts.
          refs=()
          for channel in $channels; do
            scripts/push-image.sh "$channel"
            refs+=("$base:$channel$suffix")
            [ "$channel" != stable ] || refs+=("$base:latest$suffix")
          done
          bash "$RUNNER_TEMP/sign-image.sh" --verify "${refs[@]}"
