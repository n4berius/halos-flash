name: Refresh stable with Fedora updates
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # The signing key lives in the "signing" environment, which only main and v* tags may use (#46).
    environment: signing
    strategy:
      fail-fast: false
      matrix:
        variant: [npu, no-npu]
    # id-token: signing the rebuilt images with GitHub's identity (scripts/sign-image.sh).
    permissions:
      contents: read
      packages: write
      id-token: write
    # Shared with release.yml's image job: one push moves an edition's channel tags at a time.
    concurrency:
      group: channel-tags-${{ matrix.variant }}
      cancel-in-progress: false
    env:
      HALOGEN_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Find the newest stable release
        id: stable
        run: |
          tag="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-r[0-9]+)?$' | head -1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # main's channel script, kept aside: the release checked out next may predate it.
          cp scripts/channels.sh "$RUNNER_TEMP/channels.sh"
          cp scripts/sign-image.sh "$RUNNER_TEMP/sign-image.sh"
      - if: steps.stable.outputs.tag != ''
        env:
          TAG: ${{ steps.stable.outputs.tag }}
        run: |
          # Only a release made from main is rebuilt and signed, as release.yml requires.
          git merge-base --is-ancestor "$TAG" origin/main || { echo "$TAG is not on main; nothing rebuilt" >&2; exit 1; }
          git checkout "$TAG"
      - name: Rebuild
        if: steps.stable.outputs.tag != ''
        env:
          TAG: ${{ steps.stable.outputs.tag }}
        run: |
          eval "$(scripts/release-info.sh "$TAG" | grep '^image_tag=')"
          # The push step below needs the same names; it alone gets the signing key.
          { echo "IMAGE_TAG=$image_tag"; echo "HALOS_RELEASE=${TAG#v}"; } >> "$GITHUB_ENV"
          IMAGE_TAG="$image_tag" HALOS_RELEASE="${TAG#v}" scripts/build.sh
      - name: Push the exact tag
        if: steps.stable.outputs.tag != ''
        env:
          TAG: ${{ steps.stable.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Worked out just before pushing, with every tag so far, so a release made during
          # this build counts and no channel moves back.
          git fetch -q --force --tags origin
          git tag -l 'v*' > "$RUNNER_TEMP/tags"
          channels="$("$RUNNER_TEMP/channels.sh" "$TAG" "$RUNNER_TEMP/tags")"
          # The newest stable release always leads at least the stable channel.
          [ -n "$channels" ] || { echo "no channels for $TAG; nothing was pushed" >&2; exit 1; }
          echo "Moving the channels: $channels"
          # Push the exact tag and sign it first (main's script, #46), so a channel never points
          # to an unsigned image; the signature is per digest, so it covers the channel tags too.
          image="$(scripts/image-ref.sh)"; base="${image%:*}"
          suffix=""; [ "$HALOGEN_VARIANT" = npu ] || suffix="-no-npu"
          # cosign first: a failed download must stop the run before anything is pushed.
          bash "$RUNNER_TEMP/sign-image.sh" --fetch
          podman push "$image"
          { echo "IMAGE=$image"; echo "CHANNELS=$channels"; } >> "$GITHUB_ENV"
      - name: Sign
        if: steps.stable.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # halOS's own signing key (#46): only this step gets it, and it runs only main's script.
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: GITHUB_TOKEN="$GH_TOKEN" bash "$RUNNER_TEMP/sign-image.sh" "$IMAGE"
      - name: Move the channels
        if: steps.stable.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="${IMAGE%:*}"; suffix=""; [ "$HALOGEN_VARIANT" = npu ] || suffix="-no-npu"
          channels="$CHANNELS"
          # One channel per call, which the push script of older releases also accepts.
          refs=()
          for channel in $channels; do
            scripts/push-image.sh "$channel"
            refs+=("$base:$channel$suffix")
            [ "$channel" != stable ] || refs+=("$base:latest$suffix")
          done
          bash "$RUNNER_TEMP/sign-image.sh" --verify "${refs[@]}"
